{% extends 'base.html' %}

{% block title %}
	Orders - SSE + HTMX Demo
{% endblock %}

{% block body %}
	<h1>Orders</h1>

  {% if orders %}
  	<div class="card">
      <h2>Recent orders</h2>
      <ul class="order-list">
        {% for order in orders %}
        	<li>
            <a
              href="{{ url_for('order_detail', order_id=order.id) }}"
            >{{ order.name }}</a>
            <span class="status-badge status-{{ order.status }}">
              {{ order.status }}
            </span>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
{% endblock %}
